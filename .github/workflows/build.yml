name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel-smoke:
    name: Wheel smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build distributions
        run: |
          rm -rf dist
          uvx hatch build

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          uv venv smoke-venv --python 3.11
          uv pip install --python smoke-venv dist/*.whl
          smoke-venv/bin/python scripts/wheel_smoke.py

      - name: Install and smoke-test sdist
        shell: bash
        run: |
          uv venv sdist-smoke-venv --python 3.11
          uv pip install --python sdist-smoke-venv dist/*.tar.gz
          sdist-smoke-venv/bin/python - <<'PY'
          import glmax

          print(f"imported glmax from {glmax.__file__}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci
