name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            artifact-name: dist-linux-py3.11
          - os: macos-latest
            python-version: "3.11"
            artifact-name: dist-macos-py3.11
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build distributions
        run: |
          rm -rf dist
          uvx hatch build

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          uv venv smoke-venv --python ${{ matrix.python-version }}
          uv pip install --python smoke-venv dist/*.whl
          smoke-venv/bin/python scripts/wheel_smoke.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci
