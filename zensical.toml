[project]
site_name = "glmax"
site_description = "Grammar-first generalized linear modeling in JAX."
site_url = "https://mancusolab.github.io/glmax"

repo_url = "https://github.com/mancusolab/glmax"
repo_name = "mancusolab/glmax"
edit_uri = ""

strict = true
extra_javascript = [
  "_static/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
extra_css = ["_static/custom_css.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "guide.md" },
  { "JAX Transformations" = "jax-transformations.md" },
  { "From statsmodels" = "from-statsmodels.md" },
  { "API" = [
    { "Families & Links" = "api/families-and-links.md" },
    { "fit" = [
      { "Overview" = "api/fit/index.md" },
      { "Strategies & Solvers" = "api/fit/strategies.md" },
    ] },
    { "infer" = [
      { "Overview" = "api/infer/index.md" },
      { "Strategies & Standard Errors" = "api/infer/strategies.md" },
    ] },
    { "check" = "api/check.md" },
    { "predict" = "api/predict.md" },
  ] },
  { "Misc" = [
    { "MIT License" = "license.md" },
    { "MancusoLab Open Source Community Guidelines" = "conduct.md" },
  ] },
]

[project.theme]
variant = "classic"
features = [
  "navigation.sections",
  "toc.integrate",
  "header.autohide",
]

[[project.theme.palette]]
scheme = "default"
primary = "white"
accent = "amber"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "amber"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "material/chart-bell-curve-cumulative"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.snippets]
base_path = "docs"

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = "¤"
toc_depth = 4

[project.plugins.search]

[project.plugins.autorefs]

[project.plugins.mkdocstrings]
custom_templates = "docs/_templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
load_external_modules = true

[project.plugins.mkdocstrings.handlers.python.options]
force_inspection = true
show_source = false
heading_level = 4
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
filters = ["!^_", "^__init__$"]
inherited_members = true
members_order = "source"
docstring_style = "google"
show_if_no_docstring = true
line_length = 80
modernize_annotations = true
show_overloads = false
show_signature_annotations = true
separate_signature = false
